name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        # src/routeTree.gen.ts is gitignored (generated) and is a side effect
        # of any Vite invocation via the TanStack Router plugin. tsc needs it
        # to exist before it can typecheck main.tsx/routes/*.tsx on a fresh
        # checkout; the real build below regenerates it anyway.
        run: bunx vite build

      - name: Typecheck
        run: bun run tsc -b

      - name: Lint
        run: bun run lint

      - name: Audit
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

  merkle:
    name: Merkle script (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merkle
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun audit --audit-level=high

      - name: Smoke test generation script
        run: bun run generate
